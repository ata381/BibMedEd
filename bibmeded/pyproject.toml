[project]
name = "bibmeded"
version = "0.2.0"
description = "Bibliometric Analysis Platform for Medical Education"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "networkx>=3.0.0",
    # numpy + scipy power the logistic field-maturity curve fit in
    # analysis/publications.py. In-domain for a scientometrics tool (not an ML
    # stack); without them _classify_maturity silently returns None.
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]
[project.scripts]
bibmeded = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "pytest-cov>=5.0.0",
]
docs = [
    "mkdocs-material>=9.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "frontend*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
