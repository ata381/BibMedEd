site_name: BibMedEd
site_description: Bibliometric Analysis Platform for Medical Education
site_url: https://ata381.github.io/BibMedEd/
repo_url: https://github.com/ata381/BibMedEd
repo_name: ata381/BibMedEd

theme:
  name: material
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Why BibMedEd?: why-bibmeded.md
  - What's New: whats-new.md
  - Case Study: case-study.md
  - Self-Hosting: deploy.md
  - Scripting & API: scripting.md
  - Writing Adapters: adapters.md
  - Community: community.md
  - Contribute: https://github.com/ata381/BibMedEd/blob/master/CONTRIBUTING.md

exclude_docs: |
  superpowers/
  maintainers/
  lens-connector-wip.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
