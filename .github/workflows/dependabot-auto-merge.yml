name: Dependabot auto-merge

# Enables GitHub auto-merge (squash) on Dependabot PRs that are patch-level
# updates, which is how Dependabot's security bumps usually arrive. Minor and
# major updates are left for a maintainer. This workflow never merges by
# itself: branch protection on master still requires every CI check to pass
# on an up-to-date branch before GitHub merges.

on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
