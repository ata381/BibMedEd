name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'bibmeded/**'
      - '.github/workflows/deploy-docs.yml'

concurrency:
  group: deploy-documentation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bibmeded/frontend/package-lock.json

      - run: pip install -e './bibmeded[server,docs]'

      - name: Generate demo data and downloads
        run: python bibmeded/scripts/build_pages_demo.py

      - name: Build the static demo
        working-directory: bibmeded/frontend
        env:
          NEXT_PUBLIC_PAGES_DEMO_PATH: /BibMedEd/demo
        run: |
          npm ci
          npm run build

      - name: Publish the docs and demo together
        run: |
          mkdocs build --strict
          mkdir -p site/demo
          cp -a bibmeded/frontend/out/. site/demo/
          ghp-import --no-jekyll --push --force --message "Deploy docs and demo from $GITHUB_SHA" site
