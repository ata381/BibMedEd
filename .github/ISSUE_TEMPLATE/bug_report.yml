name: Bug report
description: Something is broken or not behaving as documented.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear and concise description of the bug.
      placeholder: When I search PubMed with "medical education AND covid", the progress bar freezes at 47%.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `docker compose up`
        2. Create a project
        3. Run search with query `...`
        4. Observe `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD` or release tag.
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running BibMedEd?
      options:
        - Local docker compose
        - Render.com Blueprint
        - Custom (describe below)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs api worker` around the failure.
      render: shell
